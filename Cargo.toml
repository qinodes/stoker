[package]
name = "stoker-engine"
version = "0.3.0"
edition = "2024"
description = "A local job scheduler and execution engine"
license = "Apache-2.0"
repository = "https://github.com/qinodes/stoker"
readme = "README.md"
keywords = ["scheduler", "job-queue", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "stoker"
path = "src/main.rs"

[lib]
name = "stoker"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
fs2 = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0.28"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
futures-util = { version = "0.3.34", features = ["sink"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["process", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

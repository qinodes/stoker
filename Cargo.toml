[package]
name = "stoker-engine"
version = "0.1.0"
edition = "2024"
description = "A local, Git-aware job scheduler and execution engine"
license = "Apache-2.0"
repository = "https://github.com/qinodes/stoker"
readme = "README.md"
keywords = ["scheduler", "job-queue", "git", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "stoker"
path = "src/main.rs"

[lib]
name = "stoker"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["process", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

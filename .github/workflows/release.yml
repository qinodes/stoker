name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish from its preview artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify release tag and preview artifact
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      tag_sha: ${{ steps.metadata.outputs.tag_sha }}
      release_version: ${{ steps.metadata.outputs.release_version }}
      preview_run_id: ${{ steps.preview.outputs.preview_run_id }}
      preview_artifact_name: ${{ steps.preview.outputs.preview_artifact_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify release metadata
        id: metadata
        shell: bash
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Unsupported release tag: ${TAG}" >&2
            exit 1
          fi

          release_version="${BASH_REMATCH[1]}"
          package_version="$(sh scripts/get-version.sh)"
          if [[ "${package_version}" != "${release_version}" ]]; then
            echo "Release tag ${TAG} does not match package version ${package_version}." >&2
            exit 1
          fi

          tag_sha="$(git rev-parse "${TAG}^{commit}")"
          if [[ "${tag_sha}" != "$(git rev-parse HEAD)" ]]; then
            echo "Checked out commit does not match release tag ${TAG}." >&2
            exit 1
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "tag_sha=${tag_sha}" >> "${GITHUB_OUTPUT}"
          echo "release_version=${release_version}" >> "${GITHUB_OUTPUT}"

      - name: Find successful preview artifact for this commit
        id: preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_SHA: ${{ steps.metadata.outputs.tag_sha }}
        run: |
          set -euo pipefail
          artifact_name="preview-release-${TAG_SHA}"
          preview_run_id="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/preview.yml/runs?head_sha=${TAG_SHA}&status=success&per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | last | .id // empty')"
          if [[ -z "${preview_run_id}" ]]; then
            echo "No successful preview workflow found for commit ${TAG_SHA}." >&2
            exit 1
          fi

          artifact_count="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${preview_run_id}/artifacts?per_page=100" \
            --jq "[.artifacts[] | select(.name == \"${artifact_name}\" and .expired == false)] | length")"
          if [[ "${artifact_count}" != "1" ]]; then
            echo "Expected one unexpired ${artifact_name} artifact in preview run ${preview_run_id}, found ${artifact_count}." >&2
            exit 1
          fi

          echo "preview_run_id=${preview_run_id}" >> "${GITHUB_OUTPUT}"
          echo "preview_artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"

  publish:
    name: Publish GitHub Release
    needs: verify
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download immutable preview release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify.outputs.preview_artifact_name }}
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify.outputs.preview_run_id }}

      - name: Verify promoted release artifact
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.release_version }}
        run: |
          set -euo pipefail
          required_files=(
            stoker-linux-x86_64
            stoker-linux-x86_64.tar.gz
            stoker-windows-x86_64.exe
            stoker-windows-x86_64.zip
            stoker-macos-arm64
            stoker-macos-arm64.tar.gz
            stoker-install.ps1
            stoker-install.sh
            SHA256SUMS
          )
          for file in "${required_files[@]}"; do
            test -s "dist/${file}"
          done
          grep -Fq "\$releaseVersion = '${RELEASE_VERSION}'" dist/stoker-install.ps1
          grep -Fq "release_version='${RELEASE_VERSION}'" dist/stoker-install.sh
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi

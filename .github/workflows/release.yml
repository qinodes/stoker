name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      sha: ${{ steps.metadata.outputs.sha }}
      release_version: ${{ steps.metadata.outputs.release_version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build committed frontend resources
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          git diff --exit-code -- web/dist

      - name: Verify release metadata
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            release_version="${BASH_REMATCH[1]}"
          else
            echo "Unsupported release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi

          package_version="$(sh scripts/get-version.sh)"
          if [[ "${package_version}" != "${release_version}" ]]; then
            echo "Release tag ${RELEASE_TAG} expects package version ${release_version}, found ${package_version}." >&2
            exit 1
          fi

          tag_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if [[ "${tag_sha}" != "$(git rev-parse HEAD)" ]]; then
            echo "Checked out commit does not match release tag ${RELEASE_TAG}." >&2
            exit 1
          fi

          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "sha=${tag_sha}" >> "${GITHUB_OUTPUT}"
          echo "release_version=${release_version}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            asset: stoker-linux-x86_64.tar.gz
            binary_asset: stoker-linux-x86_64
            binary: stoker
            format: tar
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            asset: stoker-windows-x86_64.zip
            binary_asset: stoker-windows-x86_64.exe
            binary: stoker.exe
            format: zip
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            asset: stoker-macos-arm64.tar.gz
            binary_asset: stoker-macos-arm64
            binary: stoker
            format: tar
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Build
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" package/
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.binary_asset }}"
          cp LICENSE README.md package/
          if [[ "${{ matrix.format }}" == "zip" ]]; then
            (cd package && 7z a "../dist/${{ matrix.asset }}" .)
          else
            tar -C package -czf "dist/${{ matrix.asset }}" .
          fi

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ needs.verify.outputs.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  package:
    name: Assemble release artifact
    needs:
      - verify
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*-${{ needs.verify.outputs.sha }}
          path: dist
          merge-multiple: true

      - name: Add versioned installers and checksum
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.release_version }}
        run: |
          set -euo pipefail
          sed "s/__STOKER_RELEASE_VERSION__/${RELEASE_VERSION}/g" scripts/install.ps1 > dist/stoker-install.ps1
          sed "s/__STOKER_RELEASE_VERSION__/${RELEASE_VERSION}/g" scripts/install.sh > dist/stoker-install.sh
          (cd dist && sha256sum stoker-*) > dist/SHA256SUMS

          required_files=(
            stoker-linux-x86_64
            stoker-linux-x86_64.tar.gz
            stoker-windows-x86_64.exe
            stoker-windows-x86_64.zip
            stoker-macos-arm64
            stoker-macos-arm64.tar.gz
            stoker-install.ps1
            stoker-install.sh
            SHA256SUMS
          )
          for file in "${required_files[@]}"; do
            test -s "dist/${file}"
          done

          grep -Fq "\$releaseVersion = '${RELEASE_VERSION}'" dist/stoker-install.ps1
          grep -Fq "release_version='${RELEASE_VERSION}'" dist/stoker-install.sh
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.verify.outputs.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs:
      - verify
      - package
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.verify.outputs.sha }}
          path: dist

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi

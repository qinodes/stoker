name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            asset: stoker-linux-x86_64.tar.gz
            binary_asset: stoker-linux-x86_64
            binary: stoker
            format: tar
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            asset: stoker-windows-x86_64.zip
            binary_asset: stoker-windows-x86_64.exe
            binary: stoker.exe
            format: zip
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            asset: stoker-macos-arm64.tar.gz
            binary_asset: stoker-macos-arm64
            binary: stoker
            format: tar
          - os: macos-latest-large
            platform: macos-x86_64
            target: x86_64-apple-darwin
            asset: stoker-macos-x86_64.tar.gz
            binary_asset: stoker-macos-x86_64
            binary: stoker
            format: tar

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Test
        run: cargo test --locked --all-targets

      - name: Build
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" package/
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.binary_asset }}"
          cp LICENSE README.md package/
          if [[ "${{ matrix.format }}" == "zip" ]]; then
            (cd package && 7z a "../dist/${{ matrix.asset }}" .)
          else
            tar -C package -czf "dist/${{ matrix.asset }}" .
          fi

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum stoker-*) > dist/SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

name: CI

on:
  push:
    branches:
      - main
      - 'formal/v[0-9]+.[0-9]+.[0-9]+'
      - 'beta/v[0-9]+.[0-9]+.[0-9]+'
    paths-ignore:
      - '**.md'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
      - 'formal/v[0-9]+.[0-9]+.[0-9]+'
      - 'beta/v[0-9]+.[0-9]+.[0-9]+'
    paths-ignore:
      - '**.md'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Install Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend test dependencies
        run: npm ci

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check compilation
        run: cargo check --locked --all-targets --all-features

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run frontend unit tests
        run: npm run test:web:unit

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Node.js LTS
        if: runner.os == 'Windows' || runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend test dependencies
        if: runner.os == 'Windows' || runner.os == 'Linux'
        run: npm ci

      - name: Install GNU Make
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make --no-progress --yes

      - name: Run make check
        if: runner.os == 'Windows' || runner.os == 'Linux'
        run: make check

      - name: Run tests
        if: runner.os == 'macOS'
        run: cargo test --locked --all-targets

      - name: Build release binary
        if: runner.os == 'macOS'
        run: cargo build --locked --release

  browser-smoke:
    name: Browser smoke (Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend test dependencies
        run: npm ci

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:web:browser

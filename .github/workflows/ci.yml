name: CI

on:
  push:
    branches:
      - main
      - 'release/v[0-9]*.[0-9]*.[0-9]*'
      - test/ci
    paths-ignore:
      - '**.md'
      - '**.yml'
      - '**.yaml'
      - 'Makefile'
  pull_request:
    branches:
      - main
      - test/ci
    paths-ignore:
      - '**.md'
      - '**.yml'
      - '**.yaml'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: "1"

jobs:
  validate-ref:
    name: Validate branch
    runs-on: ubuntu-latest
    steps:
      - name: Accept only main or a versioned release branch
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            exit 0
          fi
          if [[ "${REF_NAME}" == "main" || "${REF_NAME}" == "test/ci" || "${REF_NAME}" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 0
          fi
          echo "Unsupported CI ref: ${REF_NAME}" >&2
          exit 1

  quality:
    name: Quality checks
    needs: validate-ref
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Install Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend test dependencies
        run: npm ci

      - name: Build frontend bundle
        run: npm run build

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check compilation
        run: cargo check --locked --all-targets --all-features

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run frontend unit tests
        run: npm run test:web:unit

  test:
    name: Test (${{ matrix.os }})
    needs: validate-ref
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run Rust tests
        run: cargo test --locked --all-targets

      - name: Build release binary
        run: cargo build --locked --release

  browser-smoke:
    name: Browser smoke (Chromium)
    needs: validate-ref
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend test dependencies
        run: npm ci

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:web:browser

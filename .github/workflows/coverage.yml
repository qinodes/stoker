name: Coverage

on:
  push:
    branches:
      - main
      - 'release/v[0-9]*.[0-9]*.[0-9]*'
      - test/coverage
    paths-ignore:
      - '**.md'
      - '**.yml'
      - '**.yaml'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ref:
    name: Validate branch
    runs-on: ubuntu-latest
    steps:
      - name: Accept only main or a versioned release branch
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${REF_NAME}" == "main" || "${REF_NAME}" == "test/coverage" || "${REF_NAME}" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 0
          fi
          echo "Unsupported coverage ref: ${REF_NAME}" >&2
          exit 1

  coverage:
    name: Code coverage
    needs: validate-ref
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --locked --all-features --workspace --lcov --output-path lcov.info

      - name: Report coverage summary
        shell: bash
        run: |
          cargo llvm-cov report --summary-only | tee coverage-summary.txt
          {
            echo '## LLVM coverage summary'
            echo '```text'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
